<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · FleetFlow TMS</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <a class="brand" href="./" style="text-decoration:none" title="Back to the website"><span class="logo">T</span>FleetFlow TMS</a>
    <div id="nav"></div>
    <div class="foot">Data: SQLite via REST API<br><span class="muted">OBC: Motive (simulated)</span><br><button class="btn sm" style="margin-top:8px" onclick="resetData()">Reset demo data</button></div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="btn sm hamb" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <h1 id="title">Dashboard</h1>
      <div class="sp"></div>
      <button class="btn sm" id="liveBtn" onclick="toggleLive()"><span class="live" id="liveInd"><i></i>Live OBC feed: off</span></button>
      <button class="btn sm" onclick="toggleTheme()" title="Toggle light/dark">Theme</button>
      <span class="who small" id="userName"></span>
      <button class="btn sm" onclick="logout()">Log out</button>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<div class="veil" id="veil" onclick="closeAll()"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal" id="modal"></div>
<div class="toasts" id="toasts"></div>

<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/nav.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/orders.js"></script>
<script src="js/load-drawer.js"></script>
<script src="js/dispatch.js"></script>
<script src="js/tracking.js"></script>
<script src="js/fleet.js"></script>
<script src="js/billing.js"></script>
<script src="js/payments.js"></script>
<script src="js/integrations.js"></script>
<script src="js/actions.js"></script>
<script src="js/main.js"></script>
</body>
</html>
